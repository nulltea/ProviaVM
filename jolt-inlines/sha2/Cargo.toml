[package]
name = "jolt-inlines-sha2"
version = "0.1.0"
edition = "2021"
description = "SHA2 inline implementations for Jolt VM"
license = "MIT"

[features]
default = []
host = ["dep:ctor", "dep:tracer", "dep:tracing"]
rv64 = ["tracer/rv64"]

[dependencies]
ctor = { version = "0.2", optional = true }
tracer = { workspace = true, optional = true, features = ["std"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
hex-literal.workspace = true
tracer = { workspace = true, features = ["std", "test-utils"] }
