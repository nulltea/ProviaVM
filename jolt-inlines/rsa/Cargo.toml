[package]
name = "jolt-inlines-rsa"
version = "0.1.0"
edition = "2021"
description = "RSA Montgomery multiplication inline for Jolt VM"
license = "MIT"

[features]
default = []
host = [
    "dep:ctor",
    "dep:tracer",
    "dep:tracing",
    "dep:ark-serialize",
    "dep:num-bigint",
]
rv64 = ["tracer?/rv64"]

[dependencies]
ctor = { version = "0.2", optional = true }
tracer = { workspace = true, optional = true, features = ["std"] }
tracing = { workspace = true, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10", default-features = false }
ark-serialize = { workspace = true, optional = true, default-features = false }
num-bigint = { workspace = true, optional = true }

[dev-dependencies]
tracer = { workspace = true, features = ["std", "test-utils"] }
rand = { workspace = true, features = ["std", "std_rng"] }
num-bigint-dig = { version = "0.8", default-features = false }
num-traits = "0.2"
num-integer = "0.1"
rsa = { version = "=0.9.6" }
sha2 = { version = "0.10", features = ["oid"] }
rand_chacha.workspace = true
postcard = { version = "1", features = ["alloc"] }
