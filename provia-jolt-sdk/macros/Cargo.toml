[package]
name = "provia-jolt-sdk-macros"
version = "0.1.0"
authors = [
    "Michael Zhu <mzhu@a16z.com>",
    "Sam Ragsdale <sragsdale@a16z.com>",
    "Noah Citron <ncitron@a16z.com>",
]
description = "SDK for Jolt"
license = "MIT"
homepage = "https://github.com/a16z/jolt/README.md"
repository = "https://github.com/a16z/jolt"
edition = "2021"

[lib]
proc-macro = true

[features]
guest-std = []

[dependencies]
syn = { version = "1.0.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0.79"

tracer = { path = "../../jolt/jolt-tracer", package = "jolt-tracer", features = ["std"] }

# These are needed to enable derive macros for tracer::common types when compiled
# outside the main workspace (e.g., during guest builds)
serde = { version = "1.0", features = ["derive"] }
ark-serialize = { version = "0.5.0", features = ["derive"] }
ark-serialize-derive = "0.5.0"
